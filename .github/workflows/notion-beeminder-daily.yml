name: Notion-Beeminder Daily Sync

on:
  schedule:
    - cron: '0 14 * * *'  # 매일 23:00 KST (UTC 14:00)
  workflow_dispatch:        # 수동 실행도 가능

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests anthropic slack-sdk

      - name: Run Notion-Beeminder sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          BEEMINDER_TOKEN: ${{ secrets.BEEMINDER_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          python run_notion_routine.py
